<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>storybook-gen · 文本转有声书</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #2d2a26;
    --muted: #8a857d;
    --accent: #c96f4a;
    --accent-soft: #f3e2d8;
    --ok: #4a7a5c;
    --err: #b04a3a;
    --line: #e7e2d9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
  header { margin-bottom: 24px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .badge.ok { background: #e4efe7; color: var(--ok); }
  .badge.err { background: #f6e3df; color: var(--err); }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  label { font-size: 13px; color: var(--muted); width: 72px; flex-shrink: 0; }
  input[type=text], input[type=password], select, textarea {
    flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; background: #fff; color: var(--ink); outline: none; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; }
  button {
    padding: 8px 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .progress-wrap { margin-top: 14px; }
  .progress-track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .status { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .file-input { flex: 1; font-size: 13px; }
  /* 队列任务列表 */
  .queue-list { margin-top: 10px; max-height: 220px; overflow-y: auto; display: none; }
  .task { display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .task:last-child { border-bottom: none; }
  .task-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task.failed .task-name { color: var(--err); }
  .task-badge {
    flex-shrink: 0; width: 48px; text-align: center; font-size: 11px; padding: 1px 6px;
    border-radius: 999px; background: var(--line); color: var(--muted);
  }
  .task.running .task-badge { background: var(--accent-soft); color: var(--accent); }
  .task.done .task-badge { background: #e4efe7; color: var(--ok); }
  .task.failed .task-badge { background: #f6e3df; color: var(--err); }
  /* 产物列表 */
  .output-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .output-item { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
  .output-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .output-size { color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .output-item a { color: var(--accent); text-decoration: none; font-size: 12px; flex-shrink: 0; }
  /* 开关样式 */
  .switch-row { display: flex; align-items: center; gap: 10px; }
  .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--line); border-radius: 999px;
    cursor: pointer; transition: background .2s;
  }
  .slider::before {
    content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform .2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .switch input:disabled + .slider { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📖 storybook-gen <span class="badge" id="providerBadge">加载中…</span></h1>
    <p>文本转有声书 · 批量挂机转换 · 可插拔 TTS 引擎 · LLM 自动语气拆解</p>
  </header>

  <!-- TTS 配置卡片 -->
  <div class="card">
    <h2>🎙️ TTS 配置 <span id="ttsBadge" class="badge err">未配置 Key</span></h2>
    <div class="row">
      <label>引擎</label>
      <select id="providerSelect">
        <option value="mimo">小米 MiMo TTS（mimo-v2.5-tts）</option>
      </select>
    </div>
    <div class="row">
      <label>API Key</label>
      <input type="password" id="apiKeyInput" placeholder="platform.xiaomimimo.com 控制台获取 MiMo API Key" autocomplete="off">
      <button id="saveKeyBtn">保存</button>
    </div>
    <p class="hint">Key 仅保存在本地 <code>.env</code> 文件，不写入源码、不上传任何服务器。</p>
  </div>

  <!-- LLM 配置卡片 -->
  <div class="card">
    <h2>🤖 LLM 配置（自动语气） <span id="llmBadge" class="badge err">未配置</span></h2>
    <div class="row">
      <label>Base URL</label>
      <input type="text" id="llmBaseUrlInput" placeholder="OpenAI 兼容接口，如 https://api.openai.com/v1" autocomplete="off">
    </div>
    <div class="row">
      <label>API Key</label>
      <input type="password" id="llmApiKeyInput" placeholder="LLM API Key（留空表示不修改）" autocomplete="off">
    </div>
    <div class="row">
      <label>Model</label>
      <input type="text" id="llmModelInput" placeholder="如 gpt-4o-mini / deepseek-chat" autocomplete="off">
      <button id="saveLlmBtn">保存</button>
    </div>
    <div class="row switch-row">
      <label>自动语气</label>
      <!-- 用 label 包裹开关：点击滑块才能触发隐藏的 checkbox -->
      <label class="switch" for="autoStyleToggle">
        <input type="checkbox" id="autoStyleToggle" disabled>
        <span class="slider"></span>
      </label>
      <span class="hint" id="autoStyleHint" style="margin-top:0;">开启后：LLM 自动拆解文本并逐段生成语气指令（需先配置并保存 LLM）</span>
    </div>
  </div>

  <!-- 转换卡片 -->
  <div class="card">
    <h2>📚 批量转换 <span id="autoStyleBadge" class="badge" style="display:none;">自动语气：开</span></h2>
    <div class="row">
      <label>音色</label>
      <select id="voiceSelect"></select>
    </div>
    <div class="row" style="align-items:flex-start;">
      <label>语气指令</label>
      <textarea id="styleInput" placeholder="可选，全局兜底。自动语气开启时仅对无指令的段生效"></textarea>
    </div>
    <div class="row">
      <label>文件</label>
      <!-- multiple：支持一次多选上百个文件 -->
      <input type="file" id="fileInput" class="file-input" accept=".txt,.md" multiple>
    </div>
    <div class="row">
      <label>或粘贴</label>
      <textarea id="textInput" placeholder="直接粘贴正文，与上传文件二选一"></textarea>
    </div>
    <div class="row">
      <button id="convertBtn">加入队列</button>
      <span class="hint">可多选上百个 txt/md 文件，按顺序自动转换；产物保存在 output/ 目录，不触发下载</span>
    </div>
    <p class="hint" id="fileCountHint"></p>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="status" id="statusText">空闲</div>
      <div class="queue-list" id="queueList"></div>
    </div>
  </div>

  <!-- 产物卡片 -->
  <div class="card">
    <h2>📁 产物（output/） <button class="ghost" id="refreshOutputBtn" style="margin-left:auto;">刷新</button></h2>
    <div class="output-list" id="outputList"><span class="hint">暂无产物</span></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let voices = [];
let llmConfigured = false;
// 上一轮轮询时队列是否活跃（用于队列清空后自动刷新产物列表）
let lastQueueActive = false;

// ---------- 状态加载 ----------
async function loadStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  $('providerBadge').textContent = data.current.toUpperCase();
  $('providerSelect').value = data.current;

  // TTS 配置状态
  const provider = data.providers.find((p) => p.id === data.current);
  const cfg = provider?.configured;
  $('ttsBadge').textContent = cfg ? '已配置 Key' : '未配置 Key';
  $('ttsBadge').className = 'badge ' + (cfg ? 'ok' : 'err');
  if (cfg) $('apiKeyInput').placeholder = 'Key 已保存，如需更换请重新填写';

  // LLM 配置状态（key 不回传，仅回传 baseUrl/model）
  llmConfigured = !!data.llm?.configured;
  $('llmBadge').textContent = llmConfigured ? '已配置' : '未配置';
  $('llmBadge').className = 'badge ' + (llmConfigured ? 'ok' : 'err');
  if (data.llm?.baseUrl) $('llmBaseUrlInput').placeholder = data.llm.baseUrl;
  if (data.llm?.model) $('llmModelInput').placeholder = data.llm.model;
  if (llmConfigured) $('llmApiKeyInput').placeholder = 'Key 已保存，留空表示不修改';

  // 自动语气开关：LLM 未配置时置灰
  const toggle = $('autoStyleToggle');
  toggle.disabled = !llmConfigured;
  toggle.checked = !!data.llm?.autoStyleEnabled;
  $('autoStyleHint').textContent = llmConfigured
    ? '开启后：LLM 自动拆解文本并逐段生成语气指令，驱动 TTS 带语气朗读'
    : '开启后：LLM 自动拆解文本并逐段生成语气指令（需先配置并保存 LLM）';
  updateAutoStyleBadge();

  voices = await fetchVoices();
  fillVoices(data.defaultVoice);
}

function updateAutoStyleBadge() {
  const on = llmConfigured && $('autoStyleToggle').checked;
  $('autoStyleBadge').style.display = on ? '' : 'none';
}

async function fetchVoices() {
  // 音色列表：此处用 mimo 精品音色；多 provider 场景可从后端 /api/status 扩展
  return [
    { id: '茉莉', label: '茉莉 · 温婉女声' },
    { id: '冰糖', label: '冰糖 · 清亮女声' },
    { id: '苏打', label: '苏打 · 清爽女声' },
    { id: '白桦', label: '白桦 · 沉稳' },
    { id: 'Mia', label: 'Mia · 英文女声' },
    { id: 'Chloe', label: 'Chloe · 英文女声' },
    { id: 'Milo', label: 'Milo · 英文男声' },
    { id: 'Dean', label: 'Dean · 英文男声' },
  ];
}

function fillVoices(defaultVoice) {
  const sel = $('voiceSelect');
  sel.innerHTML = '';
  voices.forEach((v) => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = v.label;
    sel.appendChild(opt);
  });
  sel.value = defaultVoice;
}

// ---------- 保存 TTS API Key ----------
$('saveKeyBtn').addEventListener('click', async () => {
  const apiKey = $('apiKeyInput').value.trim();
  if (!apiKey) { alert('请输入 API Key'); return; }
  $('saveKeyBtn').disabled = true;
  try {
    const res = await fetch('/api/config/apikey', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: $('providerSelect').value, apiKey }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '保存失败');
    $('apiKeyInput').value = '';
    $('ttsBadge').textContent = '已配置 Key';
    $('ttsBadge').className = 'badge ok';
    $('apiKeyInput').placeholder = 'Key 已保存，如需更换请重新填写';
    alert('TTS API Key 已保存到 .env');
  } catch (err) {
    alert('保存失败：' + err.message);
  } finally {
    $('saveKeyBtn').disabled = false;
  }
});

// ---------- 保存 LLM 配置 ----------
$('saveLlmBtn').addEventListener('click', async () => {
  const baseUrl = $('llmBaseUrlInput').value.trim();
  const model = $('llmModelInput').value.trim();
  if (!baseUrl) { alert('请输入 Base URL'); return; }
  if (!model) { alert('请输入 Model'); return; }
  $('saveLlmBtn').disabled = true;
  try {
    const res = await fetch('/api/config/llm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey: $('llmApiKeyInput').value.trim(), baseUrl, model }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '保存失败');
    $('llmApiKeyInput').value = '';
    llmConfigured = true;
    $('llmBadge').textContent = '已配置';
    $('llmBadge').className = 'badge ok';
    $('llmApiKeyInput').placeholder = 'Key 已保存，留空表示不修改';
    $('llmBaseUrlInput').placeholder = baseUrl;
    $('llmModelInput').placeholder = model;
    $('autoStyleToggle').disabled = false;
    $('autoStyleHint').textContent = '开启后：LLM 自动拆解文本并逐段生成语气指令，驱动 TTS 带语气朗读';
    alert('LLM 配置已保存到 .env');
  } catch (err) {
    alert('保存失败：' + err.message);
  } finally {
    $('saveLlmBtn').disabled = false;
  }
});

// ---------- 自动语气开关 ----------
$('autoStyleToggle').addEventListener('change', async (e) => {
  const enabled = e.target.checked;
  try {
    const res = await fetch('/api/config/autostyle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '切换失败');
    updateAutoStyleBadge();
  } catch (err) {
    e.target.checked = !enabled; // 失败回滚开关状态
    alert('切换失败：' + err.message);
  }
});

// ---------- 批量转换 ----------
// 文件多选后展示数量提示
$('fileInput').addEventListener('change', () => {
  const n = $('fileInput').files.length;
  $('fileCountHint').textContent = n ? `已选 ${n} 个文件，将按选择顺序入队转换` : '';
});

$('convertBtn').addEventListener('click', async () => {
  const files = Array.from($('fileInput').files);
  const pasted = $('textInput').value.trim();
  if (!files.length && !pasted) { alert('请上传文件或粘贴文本'); return; }

  const voice = $('voiceSelect').value;
  const style = $('styleInput').value.trim();
  // 自动语气开启时随请求下发（后端仍会校验 LLM 可用性，不可用则自动走规则拆句）
  const autoStyle = llmConfigured && $('autoStyleToggle').checked;

  $('convertBtn').disabled = true;
  try {
    if (files.length) {
      // 逐个上传入队：避免单请求体积过大，且可展示上传进度
      for (let i = 0; i < files.length; i++) {
        $('statusText').textContent = `上传入队 ${i + 1}/${files.length} · ${files[i].name}`;
        const form = new FormData();
        form.append('file', files[i]);
        form.append('voice', voice);
        if (style) form.append('style', style);
        if (autoStyle) form.append('autoStyle', 'true');
        const res = await fetch('/api/convert/file', { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.json()).error || '入队失败');
      }
      $('statusText').textContent = `已入队 ${files.length} 个文件，等待转换`;
    } else {
      // 粘贴文本：走同一条队列
      const res = await fetch('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: pasted, voice, style, autoStyle }),
      });
      if (!res.ok) throw new Error((await res.json()).error || '入队失败');
      $('statusText').textContent = '已入队，等待转换';
    }
    // 入队成功后清空输入，进度交给轮询展示
    $('fileInput').value = '';
    $('fileCountHint').textContent = '';
    $('textInput').value = '';
  } catch (err) {
    $('statusText').textContent = '失败：' + err.message;
  } finally {
    $('convertBtn').disabled = false;
  }
});

// ---------- 轮询队列进度（常驻，队列列表与产物列表随之刷新） ----------
setInterval(pollProgress, 1000);

async function pollProgress() {
  try {
    const res = await fetch('/api/progress');
    const data = await res.json();

    // 状态行：当前任务状态 + 队列统计（done/failed/pending 均为任务级）
    const stats = data.tasks.length
      ? `（完成 ${data.done} · 失败 ${data.failed} · 待处理 ${data.pending}）`
      : '';
    $('statusText').textContent = (data.status || '空闲') + stats;

    // 整体进度条：按任务数；段级进度并入状态展示
    const total = data.tasks.length;
    const finished = data.done + data.failed;
    $('progressBar').style.width = total ? Math.round((finished / total) * 100) + '%' : '0%';
    if (data.segTotal > 0) {
      $('statusText').textContent += ` 当前文件段进度 ${data.segDone}/${data.segTotal}`;
    }

    renderTasks(data.tasks);

    // 队列从活跃转为空闲：说明刚有一批任务完成，刷新产物列表
    const active = data.pending > 0 || data.tasks.some((t) => t.status === 'running');
    if (lastQueueActive && !active) loadOutput();
    lastQueueActive = active;
  } catch { /* 轮询失败忽略 */ }
}

/** 渲染队列任务列表（文件名用 textContent 防注入） */
function renderTasks(tasks) {
  const box = $('queueList');
  box.style.display = tasks.length ? 'block' : 'none';
  box.innerHTML = '';
  const badgeText = { pending: '待处理', running: '转换中', done: '完成', failed: '失败' };
  tasks.forEach((t) => {
    const div = document.createElement('div');
    div.className = 'task ' + t.status;
    const badge = document.createElement('span');
    badge.className = 'task-badge';
    badge.textContent = badgeText[t.status] || t.status;
    const name = document.createElement('span');
    name.className = 'task-name';
    name.textContent = t.filename + (t.error ? '：' + t.error : '');
    div.append(badge, name);
    box.appendChild(div);
  });
}

// ---------- 产物列表 ----------
$('refreshOutputBtn').addEventListener('click', loadOutput);

async function loadOutput() {
  try {
    const res = await fetch('/api/output');
    const data = await res.json();
    const box = $('outputList');
    box.innerHTML = '';
    if (!data.files.length) {
      box.innerHTML = '<span class="hint">暂无产物</span>';
      return;
    }
    data.files.forEach((f) => {
      const div = document.createElement('div');
      div.className = 'output-item';
      const name = document.createElement('span');
      name.className = 'output-name';
      name.textContent = f.name;
      const size = document.createElement('span');
      size.className = 'output-size';
      size.textContent = fmtSize(f.size);
      const link = document.createElement('a');
      link.href = '/api/output/' + encodeURIComponent(f.name);
      link.textContent = '下载';
      div.append(name, size, link);
      box.appendChild(div);
    });
  } catch { /* 加载失败忽略 */ }
}

/** 字节数 → 可读大小 */
function fmtSize(n) {
  if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return Math.max(1, Math.round(n / 1024)) + ' KB';
}

loadStatus();
loadOutput();
</script>
</body>
</html>
